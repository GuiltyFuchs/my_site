<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курсовой проект - Игра "Найди фигуру"</title>
  <link rel="stylesheet" href="css/game_style.css">
</head>
<body>
  <div class="button">
    <section class="game-start">
      <h1>Добро пожаловать в игру "Найди фигуру"</h1>
      <input type="text" id="player-name" placeholder="Введите ваше имя">
      <button id="start-game">Начать игру</button>
      <div class="test-buttons">
        <button class="test-button level-select" data-level="1">Уровень 1</button>
        <button class="test-button level-select" data-level="2">Уровень 2</button>
        <button class="test-button level-select" data-level="3">Уровень 3</button>
      </div>
      <!-- !!! -->
      <!-- <button onclick="window.location.href='results.html'">Результаты</button>  -->

    </section>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
